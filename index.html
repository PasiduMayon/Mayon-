<style>
/* =====================================================================
   style.css  –  DARK TECHNO THEME
   ---------------------------------------------------------------------
   1. COLORS & FONTS   <- change the whole look from this block
   2. Base / layout
   3. Page transition, background, progress bar
   4. Header & mobile menu
   5. Buttons & social icons
   6. Home page
   7. About page
   8. Category (work) pages
   9. Contact page, footer, lightbox, toast
   10. Animations & responsive rules
   ===================================================================== */

/* ============================ 1. COLORS & FONTS ============================ */
:root {
  --bg:      #04060c;                 /* page background */
  --bg-2:    #0a0f1c;                 /* slightly lighter panels */
  --card:    rgba(12, 18, 33, .72);   /* card background */
  --line:    rgba(110, 150, 255, .16);/* thin borders */
  --text:    #e7edf9;                 /* main text */
  --muted:   #8f9bb6;                 /* secondary text */
  --cyan:    #22e4ff;                 /* main neon colour */
  --blue:    #3b82f6;                 /* gradient partner */
  --violet:  #8b5cf6;                 /* second neon colour */
  --green:   #34f5a3;                 /* "online / current" dot */
  --grad:    linear-gradient(95deg, var(--cyan), var(--blue) 55%, var(--violet));

  --font-head: "Space Grotesk", system-ui, sans-serif;
  --font-body: "DM Sans", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;

  --pad: clamp(18px, 4.5vw, 34px);    /* side padding */
  --nav-h: 68px;
  --radius: 18px;
}

/* ============================== 2. BASE / LAYOUT ============================== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; scroll-padding-top: calc(var(--nav-h) + 12px); -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font-body); background: var(--bg); color: var(--text);
  line-height: 1.7; -webkit-font-smoothing: antialiased; overflow-x: hidden;
  padding-bottom: env(safe-area-inset-bottom);
}
body.lock { overflow: hidden; }
img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; }
ul { list-style: none; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; border-radius: 6px; }
::selection { background: rgba(34, 228, 255, .3); }

.container { width: min(1160px, 100% - var(--pad) * 2); margin-inline: auto; }
.section { padding: clamp(56px, 9vw, 108px) 0; position: relative; }
.ic { width: 1.25em; height: 1.25em; flex: none; }

.eyebrow { font-family: var(--font-mono); font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; color: var(--cyan); margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
.eyebrow::before { content: ""; width: 28px; height: 1px; background: var(--cyan); box-shadow: 0 0 10px var(--cyan); }
.h2 { font-family: var(--font-head); font-weight: 700; font-size: clamp(1.9rem, 5vw, 3.1rem); line-height: 1.1; letter-spacing: -.02em; }
.lead { color: var(--muted); max-width: 62ch; margin-top: 14px; font-size: 1.05rem; }
.grad-text { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.sec-head { margin-bottom: clamp(28px, 5vw, 48px); }
.skip { position: absolute; left: -999px; top: 8px; background: var(--cyan); color: #021018; padding: 8px 14px; border-radius: 8px; z-index: 300; font-weight: 700; }
.skip:focus { left: 8px; }

/* Cards (with a glow that follows the mouse) */
.card {
  position: relative; background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); overflow: hidden; transition: border-color .3s, transform .3s, box-shadow .3s;
}
.glow::before {
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .3s;
  background: radial-gradient(420px circle at var(--mx, 50%) var(--my, 50%), rgba(34, 228, 255, .13), transparent 45%);
}
.glow:hover::before { opacity: 1; }
.glow:hover { border-color: rgba(34, 228, 255, .4); box-shadow: 0 10px 40px -12px rgba(34, 228, 255, .25); }

/* ===================== 3. PAGE TRANSITION / BACKGROUND ===================== */
.pt { position: fixed; inset: 0; z-index: 500; display: flex; pointer-events: none; }
.pt i { flex: 1; background: linear-gradient(180deg, #060a14, #0b1426); border-right: 1px solid rgba(34, 228, 255, .08);
  transform-origin: top; transform: scaleY(1); animation: barOut .75s cubic-bezier(.77, 0, .18, 1) forwards; animation-delay: calc(var(--i) * 60ms); }
.pt i:last-child { border-right: 0; }
.pt.leaving i { transform-origin: bottom; transform: scaleY(0); animation: barIn .5s cubic-bezier(.77, 0, .18, 1) forwards; animation-delay: calc(var(--i) * 50ms); }
.pt.leaving { pointer-events: all; }
.pt::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 2px; background: var(--cyan); box-shadow: 0 0 24px 4px var(--cyan); transform: scaleX(0); opacity: 0; }
.pt.leaving::after { animation: beam .6s .15s ease forwards; }
@keyframes barOut { to { transform: scaleY(0); } }
@keyframes barIn  { to { transform: scaleY(1); } }
@keyframes beam   { 0% { transform: scaleX(0); opacity: 1; } 100% { transform: scaleX(1); opacity: 0; } }

#bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -2; pointer-events: none; }
.bg-grid {
  position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(900px 500px at 85% -5%, rgba(139, 92, 246, .16), transparent 60%),
    radial-gradient(800px 500px at 0% 20%, rgba(34, 228, 255, .10), transparent 60%),
    linear-gradient(rgba(110, 150, 255, .045) 1px, transparent 1px) 0 0 / 52px 52px,
    linear-gradient(90deg, rgba(110, 150, 255, .045) 1px, transparent 1px) 0 0 / 52px 52px;
  -webkit-mask-image: linear-gradient(#000 55%, transparent); mask-image: linear-gradient(#000 55%, transparent);
}
.progress { position: fixed; top: 0; left: 0; height: 3px; width: 100%; transform: scaleX(0); transform-origin: left; background: var(--grad); z-index: 200; box-shadow: 0 0 12px var(--cyan); }

/* ========================== 4. HEADER & MOBILE MENU ========================== */
.header { position: sticky; top: 0; z-index: 150; height: var(--nav-h); transition: background .3s, border-color .3s; border-bottom: 1px solid transparent; }
.header.scrolled { background: rgba(4, 6, 12, .82); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-color: var(--line); }
.nav-in { height: 100%; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.logo { font-family: var(--font-head); font-weight: 700; font-size: 1.3rem; letter-spacing: .06em; display: flex; align-items: center; gap: 10px; position: relative; z-index: 3; }
.logo-mark { font-family: var(--font-mono); font-size: .85rem; color: #021018; background: var(--grad); padding: 3px 7px; border-radius: 6px; font-weight: 700; }
.logo::after { content: "_"; color: var(--cyan); animation: caret 1s steps(1) infinite; }
.links { display: flex; align-items: center; gap: 4px; }
.links a { font-size: .93rem; font-weight: 500; color: var(--muted); padding: 8px 13px; border-radius: 10px; position: relative; transition: color .2s, background .2s; }
.links a .num { display: none; }
.links a:hover { color: var(--text); background: rgba(255, 255, 255, .05); }
.links a.active { color: var(--cyan); }
.links a.cv { border: 1px solid rgba(34, 228, 255, .45); color: var(--cyan); margin-left: 8px; background: rgba(34, 228, 255, .06); }
.links a.cv:hover { background: rgba(34, 228, 255, .16); box-shadow: 0 0 22px -4px rgba(34, 228, 255, .5); }
.links a.active::after { content: ""; position: absolute; left: 13px; right: 13px; bottom: 2px; height: 2px; background: var(--cyan); border-radius: 2px; box-shadow: 0 0 10px var(--cyan); }
.burger { display: none; width: 46px; height: 46px; border: 1px solid var(--line); border-radius: 12px; position: relative; z-index: 3; background: rgba(12, 18, 33, .7); }
.burger span { position: absolute; left: 13px; right: 13px; height: 2px; background: var(--text); border-radius: 2px; transition: transform .35s, top .35s; }
.burger span:nth-child(1) { top: 18px; } .burger span:nth-child(2) { top: 26px; }
body.menu-open .burger span:nth-child(1) { top: 22px; transform: rotate(45deg); }
body.menu-open .burger span:nth-child(2) { top: 22px; transform: rotate(-45deg); }

/* ============================ 5. BUTTONS & ICONS ============================ */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 50px; padding: 0 26px; border-radius: 14px; font-weight: 700; font-size: .98rem; border: 1px solid transparent; transition: transform .25s, box-shadow .25s, background .25s, color .25s; position: relative; overflow: hidden; }
.btn.primary { background: var(--grad); color: #021018; box-shadow: 0 8px 30px -8px rgba(34, 228, 255, .55); }
.btn.primary::after { content: ""; position: absolute; top: 0; bottom: 0; width: 60px; left: -80px; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .55), transparent); transform: skewX(-20deg); }
.btn.primary:hover::after { animation: shine .8s; }
.btn.ghost { border-color: rgba(34, 228, 255, .45); color: var(--cyan); background: rgba(34, 228, 255, .05); }
.btn.ghost:hover { background: rgba(34, 228, 255, .14); box-shadow: 0 0 28px -4px rgba(34, 228, 255, .5); }
.btn:hover { transform: translateY(-3px); }
.btn .ic { transition: transform .25s; } .btn:hover .ic { transform: translateX(3px); }
.btn.sm { min-height: 42px; padding: 0 18px; font-size: .9rem; border-radius: 12px; }

/* Round social icon buttons */
.socials { display: flex; flex-wrap: wrap; gap: 12px; }
.soc { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 14px; border: 1px solid var(--line); background: rgba(12, 18, 33, .7); color: var(--muted); transition: transform .3s, color .3s, border-color .3s, box-shadow .3s, background .3s; }
.soc .ic { width: 22px; height: 22px; }
.soc:hover { color: var(--brand, var(--cyan)); border-color: var(--brand, var(--cyan)); transform: translateY(-4px) scale(1.06); box-shadow: 0 0 26px -2px var(--brand, var(--cyan)); background: rgba(255, 255, 255, .04); }

.chip { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: .76rem; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); background: rgba(255, 255, 255, .03); transition: .25s; }
.chip:hover { color: var(--cyan); border-color: rgba(34, 228, 255, .4); }
.live { color: var(--green); border-color: rgba(52, 245, 163, .35); background: rgba(52, 245, 163, .07); }
.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px var(--green); animation: pulse 1.6s infinite; }

/* ============================== 6. HOME PAGE ============================== */
.hero { padding: clamp(28px, 6vw, 72px) 0 clamp(44px, 8vw, 90px); }
.hero-grid { display: grid; grid-template-columns: 1.2fr .8fr; gap: clamp(28px, 6vw, 70px); align-items: center; }
.status { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 22px; }
.hero h1 { font-family: var(--font-head); font-weight: 700; font-size: clamp(2.3rem, 9vw, 5.4rem); line-height: .98; letter-spacing: -.035em; text-transform: uppercase; }
.hero h1 .line { display: block; }
.word { display: inline-block; white-space: nowrap; }
.ch { display: inline-block; opacity: 0; transform: translateY(40px) rotateX(-70deg); animation: charIn .7s cubic-bezier(.2, .9, .2, 1) forwards; animation-delay: calc(.55s + var(--i) * 38ms); }
.hero h1 .line.grad .ch { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 22px rgba(34, 228, 255, .35)); }
.typed { font-family: var(--font-mono); font-size: clamp(1rem, 3.2vw, 1.35rem); margin-top: 22px; color: var(--text); min-height: 1.8em; }
.typed .prompt { color: var(--cyan); margin-right: 8px; }
.typed .cursor { display: inline-block; width: 10px; height: 1.1em; background: var(--cyan); margin-left: 3px; vertical-align: -3px; animation: caret 1s steps(1) infinite; box-shadow: 0 0 10px var(--cyan); }
.hero p.intro { margin-top: 18px; color: var(--muted); max-width: 58ch; font-size: 1.05rem; }
.hero .btns { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 30px; }
.hero .socials { margin-top: 28px; }

/* Portrait */
@property --ang { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
.portrait { position: relative; width: min(390px, 82%); aspect-ratio: 4 / 5; margin-inline: auto; }
.portrait::before { content: ""; position: absolute; inset: -3px; border-radius: 30px; background: conic-gradient(from var(--ang), var(--cyan), var(--violet), transparent 35%, var(--cyan)); animation: spin 6s linear infinite; filter: blur(.5px); }
.portrait::after { content: ""; position: absolute; inset: -30px; z-index: -1; background: radial-gradient(closest-side, rgba(34, 228, 255, .22), transparent); filter: blur(20px); }
.p-frame { position: absolute; inset: 0; border-radius: 27px; overflow: hidden; background: var(--bg-2); }
.p-frame img { width: 100%; height: 100%; object-fit: cover; object-position: center 15%; }
.p-frame::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(34, 228, 255, .05) 0 1px, transparent 1px 3px), linear-gradient(180deg, transparent 60%, rgba(4, 6, 12, .55)); }
.scan { position: absolute; left: 0; right: 0; height: 90px; top: -90px; z-index: 2; background: linear-gradient(180deg, transparent, rgba(34, 228, 255, .22), transparent); animation: scan 4.5s linear infinite; }
.tag { position: absolute; z-index: 3; font-family: var(--font-mono); font-size: .74rem; padding: 7px 12px; border-radius: 10px; background: rgba(4, 6, 12, .85); border: 1px solid rgba(34, 228, 255, .4); color: var(--cyan); display: flex; align-items: center; gap: 7px; backdrop-filter: blur(6px); animation: float 5s ease-in-out infinite; }
.tag.t1 { top: 9%; left: -9%; } .tag.t2 { bottom: 22%; right: -8%; animation-delay: -2s; color: #c4b0ff; border-color: rgba(139, 92, 246, .5); } .tag.t3 { bottom: 5%; left: -4%; animation-delay: -3.5s; }

/* Stats */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: clamp(34px, 6vw, 60px); }
.stat { padding: 22px 18px; text-align: center; }
.stat b { display: block; font-family: var(--font-head); font-size: clamp(1.9rem, 5vw, 3rem); line-height: 1; }
.stat span { display: block; margin-top: 8px; color: var(--muted); font-size: .88rem; line-height: 1.4; }

/* Marquee */
.marquee { overflow: hidden; border-block: 1px solid var(--line); background: rgba(10, 15, 28, .6); padding: 16px 0; -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); }
.track { display: flex; width: max-content; gap: 42px; animation: marquee 32s linear infinite; }
.marquee:hover .track { animation-play-state: paused; }
.track span { font-family: var(--font-head); font-weight: 700; font-size: clamp(1rem, 2.6vw, 1.4rem); white-space: nowrap; color: var(--muted); display: flex; align-items: center; gap: 42px; }
.track span::after { content: "◆"; color: var(--cyan); font-size: .7em; }

/* Current job */
.now { display: grid; grid-template-columns: 170px 1fr auto; gap: clamp(18px, 4vw, 34px); align-items: center; padding: clamp(20px, 3.5vw, 32px); border-color: rgba(34, 228, 255, .3); background: linear-gradient(135deg, rgba(34, 228, 255, .08), rgba(139, 92, 246, .06) 60%, var(--card)); }
.now-logo { background: #fff; border-radius: 16px; padding: 10px; aspect-ratio: 1; display: grid; place-items: center; box-shadow: 0 0 40px -6px rgba(34, 228, 255, .45); }
.now-logo img { width: 100%; height: 100%; object-fit: contain; }
.now h3 { font-family: var(--font-head); font-size: clamp(1.4rem, 3.4vw, 2rem); line-height: 1.15; margin: 10px 0 4px; }
.now .where { font-family: var(--font-mono); font-size: .82rem; color: var(--cyan); }
.now p { color: var(--muted); margin-top: 10px; max-width: 60ch; }

/* Category cards */
.cats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
.cat { display: flex; flex-direction: column; gap: 14px; padding: clamp(22px, 3.5vw, 32px); min-height: 250px; }
.cat:hover { transform: translateY(-6px); }
.cat-top { display: flex; justify-content: space-between; align-items: flex-start; }
.cat-ic { width: 56px; height: 56px; display: grid; place-items: center; border-radius: 16px; background: rgba(34, 228, 255, .09); border: 1px solid rgba(34, 228, 255, .3); color: var(--cyan); transition: .3s; }
.cat-ic .ic { width: 26px; height: 26px; }
.cat:hover .cat-ic { background: var(--grad); color: #021018; box-shadow: 0 0 30px rgba(34, 228, 255, .5); transform: rotate(-6deg) scale(1.05); }
.cat-no { font-family: var(--font-mono); font-size: 2.2rem; font-weight: 500; color: rgba(143, 155, 182, .25); line-height: 1; }
.cat h3 { font-family: var(--font-head); font-size: 1.45rem; line-height: 1.2; }
.cat p { color: var(--muted); font-size: .96rem; }
.cat-foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; font-family: var(--font-mono); font-size: .8rem; color: var(--muted); }
.cat-foot .go { color: var(--cyan); display: flex; align-items: center; gap: 8px; font-weight: 500; }
.cat-foot .go .ic { transition: transform .3s; } .cat:hover .go .ic { transform: translateX(6px); }

.cta { text-align: center; padding: clamp(36px, 7vw, 70px) var(--pad); background: radial-gradient(600px 240px at 50% 0, rgba(34, 228, 255, .14), transparent 70%), var(--card); }
.cta .h2 { max-width: 20ch; margin-inline: auto; }
.cta .btns { display: flex; justify-content: center; flex-wrap: wrap; gap: 14px; margin-top: 28px; }

/* ============================== 7. ABOUT PAGE ============================== */
.page-hero { padding: clamp(34px, 7vw, 80px) 0 clamp(10px, 3vw, 30px); }
.crumbs { font-family: var(--font-mono); font-size: .8rem; color: var(--muted); display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
.crumbs a:hover { color: var(--cyan); } .crumbs b { color: var(--cyan); font-weight: 500; }
.about-grid { display: grid; grid-template-columns: .8fr 1.2fr; gap: clamp(26px, 6vw, 70px); align-items: start; }
.about-grid .portrait { margin: 0 auto; position: sticky; top: calc(var(--nav-h) + 24px); }
.about-text p { color: #c3cce0; font-size: 1.07rem; margin-bottom: 16px; }
.about-text .btns { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.panel { padding: clamp(20px, 3.5vw, 30px); }
.panel h3 { font-family: var(--font-head); font-size: 1.2rem; display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.panel h3 .ic { color: var(--cyan); }
.edu + .edu { margin-top: 18px; padding-top: 18px; border-top: 1px dashed var(--line); }
.edu b { display: block; font-family: var(--font-head); font-size: 1.05rem; line-height: 1.3; }
.edu small, .t-meta { font-family: var(--font-mono); font-size: .78rem; color: var(--cyan); display: block; margin-top: 4px; }
.edu p { color: var(--muted); font-size: .92rem; margin-top: 4px; }
.timeline { position: relative; padding-left: 34px; }
.timeline::before { content: ""; position: absolute; left: 9px; top: 8px; bottom: 8px; width: 2px; background: linear-gradient(var(--cyan), var(--violet), transparent); box-shadow: 0 0 12px rgba(34, 228, 255, .5); }
.t-item { position: relative; padding: 22px 24px; margin-bottom: 18px; }
.t-item::before { content: ""; position: absolute; left: -33px; top: 30px; width: 14px; height: 14px; border-radius: 50%; background: var(--bg); border: 2px solid var(--cyan); box-shadow: 0 0 14px var(--cyan); }
.t-item h3 { font-family: var(--font-head); font-size: 1.15rem; line-height: 1.3; }
.t-place { color: var(--muted); font-size: .95rem; }
.t-item ul { margin-top: 12px; display: grid; gap: 6px; }
.t-item li, .job li { position: relative; padding-left: 20px; color: #c3cce0; font-size: .95rem; line-height: 1.6; }
.t-item li::before, .job li::before { content: "›"; position: absolute; left: 2px; color: var(--cyan); font-weight: 700; }
.skills { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 18px; }
.skill h3 { font-family: var(--font-head); font-size: 1.15rem; display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.skill h3 .ic { width: 38px; height: 38px; padding: 9px; border-radius: 11px; background: rgba(34, 228, 255, .09); border: 1px solid rgba(34, 228, 255, .3); color: var(--cyan); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips .chip { font-size: .8rem; color: #b6c2dc; }
.ach + .ach { margin-top: 14px; }

  /* --------------------------- CATEGORY PAGES --------------------------- */

          ${j.links && j.links.length ? `<div class="links-row">${j.links.map((l) => `<a class="lnk" href="${esc(l.url)}" target="_blank" rel="noopener">${icon(linkIcon(l.url))} ${esc(l.label)} ${icon("upright")}</a>`).join("")}</div>` : ""}

    app.innerHTML = `

    ${photos.length ? `<section class="section" style="padding-top:0"><div class="container">

      <div class="gallery">${photos.map((p, i) => `<button class="shot reveal" type="button" data-i="${i}" aria-label="Open photo ${i + 1}"${d(i % 6)}><img src="${esc(p)}" alt="" loading="lazy" onerror="this.parentNode.style.display='none'"></button>`).join("")}</div>

    <section class="section" style="padding-top:0"><div class="container"><div class="pager">

    $$(".shot").forEach((b) => b.addEventListener("click", () => openLightbox(+b.dataset.i)));

  /* ------------------------------ CONTACT ------------------------------ */
  function renderContact() {
    app.innerHTML = `
    <section class="page-hero"><div class="container">
      <div class="crumbs"><a href="#/">Home</a> / <b>Contact</b></div>
      <div class="reveal in"><div class="eyebrow">Contact</div><h1 class="h2" style="font-size:clamp(2.2rem,7vw,4.2rem)">Let's <span class="grad-text">work together</span></h1>
      <p class="lead">Pick whichever channel suits you. Messaging me on WhatsApp is usually the fastest way to reach me.</p></div>
    </div></section>
    <section class="section" style="padding-top:clamp(24px,4vw,40px)"><div class="container">
      <div class="contact-grid">${S.socials.map((s, i) => `
        <a class="card big-soc reveal" href="${esc(s.url)}" target="_blank" rel="noopener" style="--brand:${esc(s.brand)};--d:${i}">
          <span class="soc">${icon(s.icon)}</span><div><b>${esc(s.name)}</b><span>${esc(s.handle)}</span></div>
          <span class="arrow">${icon("upright")}</span></a>`).join("")}</div>
      <div class="info">
        <button class="card glow copy reveal" type="button" data-copy="${esc(S.email)}"><span class="soc">${icon("mail")}</span><span><small>Email · tap to copy</small><b>${esc(S.email)}</b></span></button>
        <a class="card glow reveal"${d(1)} href="tel:${esc(S.phoneLink)}"><span class="soc">${icon("phone")}</span><span><small>Phone</small><b>${esc(S.phone)}</b></span></a>
        <div class="card glow reveal"${d(2)}><span class="soc">${icon("pin")}</span><span><small>Location</small><b>${esc(S.location)}</b></span></div>
      </div>
      <div class="btns" style="display:flex;flex-wrap:wrap;gap:14px;margin-top:30px">
        <a class="btn primary" href="mailto:${esc(S.email)}">${icon("mail")} Send an email</a>
        ${cvBtn("ghost")}</div>
    </div></section>`;
    $(".copy").addEventListener("click", (e) => {
      const v = e.currentTarget.dataset.copy;
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(v).then(() => say("Email copied to clipboard"), () => (location.href = "mailto:" + v));
      else location.href = "mailto:" + v;
    });
  }

  /* ------------------------------ LIGHTBOX ------------------------------ */
  const lb = document.createElement("div");
  lb.className = "lightbox"; lb.setAttribute("role", "dialog"); lb.setAttribute("aria-modal", "true"); lb.setAttribute("aria-label", "Photo viewer");
  lb.innerHTML = `<button class="lb-btn lb-close" aria-label="Close">${icon("x")}</button>
    <button class="lb-btn lb-prev" aria-label="Previous photo">${icon("back")}</button><img alt=""><button class="lb-btn lb-next" aria-label="Next photo">${icon("arrow")}</button><div class="lb-count"></div>`;
  document.body.appendChild(lb);
  const lbImg = $("img", lb), lbCount = $(".lb-count", lb);
  let li = 0, lastFocus = null;
  const showPhoto = (n) => { if (!photos.length) return; li = (n + photos.length) % photos.length; lbImg.src = photos[li]; lbCount.textContent = `${li + 1} / ${photos.length}`; };
  function openLightbox(n) { lastFocus = document.activeElement; showPhoto(n); lb.classList.add("open"); document.body.classList.add("lock"); $(".lb-close", lb).focus(); }
  function closeLightbox() { lb.classList.remove("open"); document.body.classList.remove("lock"); if (lastFocus && lastFocus.focus) lastFocus.focus(); }
  $(".lb-close", lb).addEventListener("click", closeLightbox);
  $(".lb-prev", lb).addEventListener("click", (e) => { e.stopPropagation(); showPhoto(li - 1); });
  $(".lb-next", lb).addEventListener("click", (e) => { e.stopPropagation(); showPhoto(li + 1); });
  lb.addEventListener("click", (e) => { if (e.target === lb) closeLightbox(); });
  document.addEventListener("keydown", (e) => {
    if (!lb.classList.contains("open")) return;
    if (e.key === "Escape") closeLightbox(); if (e.key === "ArrowLeft") showPhoto(li - 1); if (e.key === "ArrowRight") showPhoto(li + 1);
  });
  let x0 = null;   // swipe on phones
  lb.addEventListener("touchstart", (e) => { x0 = e.touches[0].clientX; }, { passive: true });
  lb.addEventListener("touchend", (e) => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 50) showPhoto(li + (dx < 0 ? 1 : -1)); x0 = null; });

  /* ------------------- SCROLL EFFECTS (header, bar, reveal) ------------------- */
  const header = $("#header"), bar = $("#progress");
  let ticking = false;
  const onScroll = () => {
    if (ticking) return; ticking = true;
    requestAnimationFrame(() => {
      const y = window.scrollY, h = document.documentElement.scrollHeight - innerHeight;
      header.classList.toggle("scrolled", y > 10);
      bar.style.transform = `scaleX(${h > 0 ? Math.min(y / h, 1) : 0})`;
      ticking = false;
    });
  };
  addEventListener("scroll", onScroll, { passive: true });
  document.addEventListener("pointermove", (e) => {
    const c = e.target.closest && e.target.closest(".glow"); if (!c) return;
    const r = c.getBoundingClientRect(); c.style.setProperty("--mx", e.clientX - r.left + "px"); c.style.setProperty("--my", e.clientY - r.top + "px");
  }, { passive: true });

  let io = null;
  function initContent() {
    if (io) io.disconnect();
    const items = $$("#app .reveal:not(.in)");
    if (!("IntersectionObserver" in window) || reduce) items.forEach((e) => e.classList.add("in"));
    else {
      io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: 0.12, rootMargin: "0px 0px -6% 0px" });
      items.forEach((e) => io.observe(e));
    }
    $$("[data-count]").forEach((el) => {
      const end = +el.dataset.count, suf = el.dataset.suffix || "";
      const run = () => {
        if (reduce) { el.textContent = end + suf; return; }
        const t0 = performance.now();
        (function step(t) { const p = Math.min((t - t0) / 1400, 1); el.textContent = Math.round(end * (1 - Math.pow(1 - p, 3))) + suf; if (p < 1) requestAnimationFrame(step); })(t0);
      };
      if ("IntersectionObserver" in window) { const o = new IntersectionObserver((es) => { if (es[0].isIntersecting) { run(); o.disconnect(); } }); o.observe(el); } else run();
    });
    onScroll();
  }

  /* ------------------------------ ROUTER ------------------------------ */
  const keyOf = (hash) => {
    const k = String(hash || "").replace(/^#\/?/, "").split("/")[0].toLowerCase();
    if (!k) return "home";
    return k === "about" || k === "contact" || S.work.some((w) => w.id === k) ? k : "home";
  };
  function render(key) {
    current = key; typeTok++;
    if (key === "home") renderHome();
    else if (key === "about") renderAbout();
    else if (key === "contact") renderContact();
    else renderCategory(key);
    $$("#links a[data-k]").forEach((a) => a.classList.toggle("active", a.dataset.k === key));
    const w = S.work.find((x) => x.id === key);
    document.title = key === "home" ? `${S.logo.charAt(0) + S.logo.slice(1).toLowerCase()} | ${S.roles.join(", ")}` : `${w ? w.title : key.charAt(0).toUpperCase() + key.slice(1)} | ${S.logo.charAt(0) + S.logo.slice(1).toLowerCase()}`;
    initContent();
  }
  const jumpTop = () => { const h = document.documentElement; h.style.scrollBehavior = "auto"; window.scrollTo(0, 0); h.style.scrollBehavior = ""; };
  let busy = false, suppress = false;
  function go(hash, anchor, fromPop) {
    const key = keyOf(hash);
    if (key === current) {
      if (anchor) { const el = document.getElementById(anchor); if (el) el.scrollIntoView({ behavior: reduce ? "auto" : "smooth" }); }
      else if (!fromPop) window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
      document.body.classList.remove("menu-open", "lock");
      return;
    }
    if (busy) return;
    busy = true;
    document.body.classList.remove("menu-open", "lock");
    const swap = () => {
      if (!fromPop) { const target = hash === "#/" ? "#/" : hash; if (location.hash !== target) { suppress = true; location.hash = target; } }
      render(key); closeLightbox();
      if (anchor) { const el = document.getElementById(anchor); if (el) el.scrollIntoView(); } else jumpTop();
      pt.classList.remove("leaving"); busy = false;
    };
    if (reduce) { swap(); return; }
    pt.classList.add("leaving");
    setTimeout(swap, 620);
  }
  addEventListener("hashchange", () => { if (suppress) { suppress = false; return; } go(location.hash, null, true); });

  /* All clicks on links: CV download, page changes and in-page anchors */
  document.addEventListener("click", (e) => {
    const a = e.target.closest("a"); if (!a || e.defaultPrevented) return;
    if (a.hasAttribute("data-cv")) { e.preventDefault(); document.body.classList.remove("menu-open", "lock"); downloadCV(); return; }
    const href = a.getAttribute("href"); if (!href) return;
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
    if (href.indexOf("#/") === 0) { e.preventDefault(); go(href, a.dataset.anchor); return; }
    if (href.charAt(0) === "#" && href.length > 1) {
      e.preventDefault(); document.body.classList.remove("menu-open", "lock");
      const el = document.getElementById(href.slice(1)); if (el) el.scrollIntoView({ behavior: reduce ? "auto" : "smooth" });
    }
  });

  /* --------------------------- BACKGROUND CANVAS --------------------------- */
  function initCanvas() {
    const cv = $("#bg"); if (!cv || reduce) return;
    const ctx = cv.getContext("2d"); let w, h, pts = [], mouse = { x: -999, y: -999 }, run = true;
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    const resize = () => {
      w = cv.width = innerWidth * dpr; h = cv.height = innerHeight * dpr;
      const n = Math.min(Math.floor((innerWidth * innerHeight) / 16000), 90);
      pts = Array.from({ length: n }, () => ({ x: Math.random() * w, y: Math.random() * h, vx: (Math.random() - .5) * .35 * dpr, vy: (Math.random() - .5) * .35 * dpr }));
    };
    resize(); addEventListener("resize", resize);
    addEventListener("pointermove", (e) => { mouse.x = e.clientX * dpr; mouse.y = e.clientY * dpr; }, { passive: true });
    document.addEventListener("visibilitychange", () => { run = !document.hidden; if (run) draw(); });
    const maxD = 130 * dpr;
    function draw() {
      if (!run) return;
      ctx.clearRect(0, 0, w, h);
      for (let i = 0; i < pts.length; i++) {
        const p = pts[i]; p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > w) p.vx *= -1; if (p.y < 0 || p.y > h) p.vy *= -1;
        ctx.fillStyle = "rgba(34,228,255,.55)"; ctx.beginPath(); ctx.arc(p.x, p.y, 1.4 * dpr, 0, 6.283); ctx.fill();
        for (let j = i + 1; j < pts.length; j++) {
          const q = pts[j], dx = p.x - q.x, dy = p.y - q.y, dist = Math.hypot(dx, dy);
          if (dist < maxD) { ctx.strokeStyle = `rgba(80,150,255,${(1 - dist / maxD) * .22})`; ctx.lineWidth = dpr * .8; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke(); }
        }
        const mx = p.x - mouse.x, my = p.y - mouse.y, md = Math.hypot(mx, my);
        if (md < 160 * dpr) { ctx.strokeStyle = `rgba(139,92,246,${(1 - md / (160 * dpr)) * .5})`; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke(); }
      }
      requestAnimationFrame(draw);
    }
    draw();
  }

  /* ------------------------------ START ------------------------------ */
  if (A.favicon) { const f = $("#fav"); if (f) f.href = A.favicon; const t = $("#fav-apple"); if (t) t.href = A.favicon; }
  renderHeader();
  renderFooter();
  render(keyOf(location.hash));
  initCanvas();
});

</script>
