<style>
/* =====================================================================
   1. COLORS & FONTS  –  change the look of the whole site right here
   ===================================================================== */
:root {
  --bg:       #eef1f4;   /* page background */
  --surface:  #ffffff;   /* cards */
  --ink:      #10151c;   /* main text + dark sections */
  --muted:    #566170;   /* secondary text */
  --accent:   #e5343a;   /* highlight colour (the "on air" red) */
  --line:     #d5dbe2;   /* thin borders */
  --font-head: "Bricolage Grotesque", system-ui, sans-serif;
  --font-body: "DM Sans", system-ui, sans-serif;
}

/* =====================================================================
   2. STYLES  –  you normally don't need to touch anything below
   ===================================================================== */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{font-family:var(--font-body);background:var(--bg);color:var(--ink);line-height:1.65;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{width:min(1120px,92%);margin-inline:auto}
h1,h2,h3{font-family:var(--font-head);line-height:1.1;letter-spacing:-.02em}

/* ---- Navigation ---- */
.nav{position:sticky;top:0;z-index:20;background:rgba(238,241,244,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px}
.logo{font-family:var(--font-head);font-weight:800;font-size:1.25rem;text-decoration:none;display:flex;align-items:center;gap:10px}
.logo i{width:10px;height:10px;border-radius:50%;background:var(--accent);display:inline-block;animation:blink 2s infinite}
@keyframes blink{50%{opacity:.25}}
.nav ul{display:flex;gap:26px;list-style:none}
.nav ul a{text-decoration:none;font-size:.95rem;font-weight:500;color:var(--muted)}
.nav ul a:hover{color:var(--ink)}
.menu-btn{display:none;background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}

/* ---- Hero ---- */
.hero{padding:clamp(48px,9vw,110px) 0 clamp(48px,7vw,90px)}
.hero .wrap{display:grid;grid-template-columns:1.25fr .75fr;gap:clamp(28px,6vw,80px);align-items:center}
.hero h1{font-size:clamp(2.6rem,7vw,5.4rem);font-weight:800}
.hero h1 span{color:var(--accent)}
.hero .role{margin-top:18px;font-weight:700;font-size:1.1rem}
.hero p.intro{margin-top:14px;color:var(--muted);max-width:56ch;font-size:1.08rem}
.btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.btn{display:inline-block;padding:13px 24px;border-radius:999px;font-weight:700;text-decoration:none;border:2px solid var(--ink);transition:.2s}
.btn.primary{background:var(--ink);color:#fff}
.btn.primary:hover{background:var(--accent);border-color:var(--accent)}
.btn.ghost:hover{background:var(--ink);color:#fff}
.portrait{aspect-ratio:1/1.1;border-radius:28px 28px 120px 28px;overflow:hidden;background:var(--ink);box-shadow:14px 14px 0 var(--accent)}
.portrait img{width:100%;height:100%;object-fit:cover;object-position:center 15%} /* change 15% to move the crop up/down */

/* ---- Skill strip ---- */
.strip{background:var(--ink);color:#fff;padding:18px 0;overflow:hidden}
.strip .wrap{display:flex;flex-wrap:wrap;gap:10px 34px;justify-content:center;font-family:var(--font-head);font-weight:700;font-size:1.05rem}

/* ---- Sections ---- */
section.block{padding:clamp(56px,8vw,100px) 0}
.sec-head{margin-bottom:40px;max-width:60ch}
.sec-head h2{font-size:clamp(2rem,4.5vw,3.2rem);font-weight:800}
.sec-head p{margin-top:10px;color:var(--muted)}
.about p{font-size:1.15rem;max-width:68ch;color:#2b3440}

/* ---- Work cards ---- */
.work{background:var(--surface);border:1px solid var(--line);border-radius:22px;margin-bottom:34px;overflow:hidden}
.work-top{padding:clamp(22px,4vw,40px);border-bottom:1px solid var(--line)}
.work-top h3{font-size:clamp(1.5rem,3vw,2.1rem);font-weight:800}
.work-top p.sub{color:var(--muted);margin-top:6px}
.job{display:grid;grid-template-columns:.9fr 1.1fr;gap:clamp(18px,4vw,44px);padding:clamp(22px,4vw,40px);border-bottom:1px solid var(--line)}
.job:last-child{border-bottom:0}
.job .thumb{border-radius:14px;overflow:hidden;background:var(--bg);align-self:start;aspect-ratio:16/10}
.job .thumb img{width:100%;height:100%;object-fit:cover}
.job h4{font-family:var(--font-head);font-size:1.4rem;font-weight:700}
.job .when{display:inline-block;margin:6px 0 12px;font-size:.88rem;font-weight:700;color:var(--accent)}
.job p{color:#2b3440;margin-bottom:12px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.links a{font-size:.9rem;font-weight:600;padding:6px 14px;border:1px solid var(--ink);border-radius:999px;text-decoration:none}
.links a:hover{background:var(--ink);color:#fff}

/* ---- Photo galleries ---- */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;padding:0 clamp(22px,4vw,40px) clamp(22px,4vw,40px)}
.gallery button{border:0;padding:0;background:none;cursor:zoom-in;border-radius:12px;overflow:hidden;aspect-ratio:1/1}
.gallery img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.gallery button:hover img{transform:scale(1.06)}

/* ---- Lightbox ---- */
.lightbox{position:fixed;inset:0;background:rgba(10,13,18,.92);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;cursor:zoom-out}
.lightbox.open{display:flex}
.lightbox img{max-height:92vh;border-radius:10px}

/* ---- Contact (dark) ---- */
.contact{background:var(--ink);color:#fff}
.contact .sec-head p{color:#aab3bf}
.contact-grid{display:flex;flex-wrap:wrap;gap:14px}
.contact-grid a{display:flex;align-items:center;gap:10px;padding:14px 22px;border:1px solid #38424f;border-radius:14px;text-decoration:none;font-weight:600;transition:.2s}
.contact-grid a:hover{background:var(--accent);border-color:var(--accent)}
.phone{font-family:var(--font-head);font-size:clamp(1.8rem,5vw,3rem);font-weight:800;margin-top:34px;display:block;text-decoration:none}
footer{background:var(--ink);color:#7f8a98;text-align:center;padding:22px 0 30px;font-size:.9rem;border-top:1px solid #232b36}

/* ---- Mobile ---- */
@media(max-width:820px){
  .hero .wrap,.job{grid-template-columns:1fr}
  .portrait{max-width:340px;order:-1}
  .menu-btn{display:block}
  .nav ul{display:none;position:absolute;top:64px;left:0;right:0;background:var(--bg);flex-direction:column;padding:18px 4%;gap:14px;border-bottom:1px solid var(--line)}
  .nav ul.open{display:flex}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

const $ = (id) => document.getElementById(id);

// Basic text
$("logoText").textContent = SITE.logo;
$("heroName").innerHTML = esc(SITE.nameFirst) + " <span>" + esc(SITE.nameLast) + "</span>";
$("heroRole").textContent = SITE.role;
$("heroIntro").textContent = SITE.intro;

$("aboutText").textContent = SITE.about;
$("footerText").textContent = SITE.footer;
$("skills").innerHTML = SITE.skills.map(s => "<span>" + esc(s) + "</span>").join("");

// Contact

$("phoneLink").textContent = SITE.phone;

        <span class="when">${esc(j.role)}</span>
        <p>${esc(j.text)}</p>

    </div>`).join("");
  const photos = (cat.photos && cat.photos.length)
    ? `<div class="gallery">${cat.photos.map(p => `<button type="button" data-full="${esc(p)}" aria-label="Enlarge photo"><img src="${esc(p)}" alt="" loading="lazy"></button>`).join("")}</div>` : "";
  return `
    <article class="work">
      <div class="work-top"><h3>${esc(cat.title)}</h3><p class="sub">${esc(cat.subtitle)}</p></div>
      ${jobs}${photos}
    </article>`;
}).join("");

// Lightbox
const lb = $("lightbox");
document.addEventListener("click", e => {
  const btn = e.target.closest(".gallery button");
  if (btn) { $("lightboxImg").src = btn.dataset.full; lb.classList.add("open"); }
  else if (e.target.closest("#lightbox")) lb.classList.remove("open");
});
document.addEventListener("keydown", e => { if (e.key === "Escape") lb.classList.remove("open"); });

// Mobile menu
$("menuBtn").addEventListener("click", () => $("menuList").classList.toggle("open"));
$("menuList").addEventListener("click", () => $("menuList").classList.remove("open"));
</script>
</body>
</html>
